<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="icon" type="image/png" href="/thumbnail.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Inventory System</title>
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="login-brand">
                <img src="./thumbnail.png" alt="Logo Inventory System" class="login-logo">
                <h1>Inventory</h1>
                <p>Management System</p>
            </div>

            <form id="loginForm" novalidate>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Masukkan username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Masukkan password"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" id="togglePassword" class="toggle-password" aria-label="Tampilkan password">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="loginButton">
                    Masuk
                </button>

                <p id="loginMessage" class="login-message"></p>

            </form>

        </div>

    </div>

    <script src="./js/config.js"></script>
    <script src="./js/auth.js"></script>

</body>
</html>
